aid: cloudgenix
name: Cloudgenix
description: >-
  CloudGenix was a cloud-native SD-WAN (software-defined wide area network)
  company founded in 2013 and backed by Mayfield. Its AppFabric platform let
  enterprises build application-defined, policy-driven WANs managed from a cloud
  controller, with a full REST API (the CloudGenix Cloud Controller / AppFabric
  API) and first-party SDKs in Python, C#, Java, and JavaScript plus a
  CI-capable configuration CLI. Palo Alto Networks acquired CloudGenix in April
  2020 for more than $420M and rebranded the product as Prisma SD-WAN, now part
  of the Prisma SASE portfolio. The public developer tooling remains published
  under the official CloudGenix GitHub organization.
